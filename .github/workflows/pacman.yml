name: Generate Pac-Man Contribution Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate Pacman SVG
        uses: FontouraC18H22O2/pacman-contribution-graph@main
        with:
          github_user_name: FontouraC18H22O2

      - name: Push Pacman SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: github-contribution-grid-snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
